name: spot

# Shared by every Flink service: one image, one configuration. The image's
# entrypoint writes FLINK_PROPERTIES into Flink's config before running any
# command, including the submit script's.
x-flink: &flink
  build: ./flink
  image: spot-flink:1.20
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      rest.address: jobmanager
      rest.port: 8081
      jobmanager.memory.process.size: 1024m
      taskmanager.memory.process.size: 1536m
      # Four slots: M4's two jobs, one ad-hoc SQL client query, and room for
      # M5 and M6. Parallelism 1 means one slot per job.
      taskmanager.numberOfTaskSlots: 4
      parallelism.default: 1
      # A checkpoint is a consistent snapshot of every operator's state and
      # every source's offsets. On a failure the job rewinds to the last one.
      execution.checkpointing.interval: 30s
      state.checkpoints.dir: file:///opt/flink/checkpoints
      # Ten retries, ten seconds apart, then FAILED in the UI. Finite on
      # purpose: a poison message should end up visible, not retried forever.
      restart-strategy.type: fixed-delay
      restart-strategy.fixed-delay.attempts: 10
      restart-strategy.fixed-delay.delay: 10s

services:
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      # Host-side access. In-container clients use kafka:9092 instead.
      - "29092:29092"
    environment:
      # --- KRaft: this one process is both broker and controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Fixed cluster id: the data volume is formatted with it on first boot,
      # and a changed id makes the existing volume unreadable.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

      # --- Listeners ---
      # INTERNAL  : other containers, advertised as kafka:9092
      # HOST      : processes on the laptop, advertised as localhost:29092
      # CONTROLLER: KRaft quorum traffic. Bound to the routable hostname, not
      #   0.0.0.0: a controller listener is advertised to the quorum but is not
      #   allowed in advertised.listeners, so Kafka advertises its `listeners`
      #   entry verbatim and rejects the nonroutable meta-address. Must match
      #   the host in KAFKA_CONTROLLER_QUORUM_VOTERS.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:29092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Single-broker sizing: every internal topic must fit on one node ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # No point waiting for other consumers to join a group on a laptop.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Runs once on `docker compose up`, creates the topic, exits 0.
  # A stopped kafka-init container is the expected steady state.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    # The script must be ONE argument to `bash -c`. A string `command:` is
    # word-split by Compose, which would hand bash only the first word.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic plays \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=604800000 \
          --config compression.type=snappy
        echo "--- plays ---"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic plays

  postgres:
    image: postgres:16-alpine
    ports:
      # Host 5432 is taken by an unrelated local Postgres, hence 55432.
      # Containers still reach it as postgres:5432.
      - "55432:5432"
    environment:
      POSTGRES_USER: spot
      POSTGRES_PASSWORD: spot
      POSTGRES_DB: spot
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Only runs when the data volume is empty. Editing init.sql after the
      # first boot does nothing until `docker compose down -v`.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # -U and -d matter: without them pg_isready checks the root role and
      # reports ready while the init script is still running.
      test: ["CMD-SHELL", "pg_isready -U spot -d spot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  simulator:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: plays
      SIM_LISTENERS: 20
      SIM_SPEED: ${SIM_SPEED:-1.0}
      SIM_LATE_EVENT_RATE: 0.0
      SIM_MODE: live
    restart: unless-stopped

  poller:
    build: .
    # The image's CMD runs the simulator; this service runs the real poller.
    command: ["python", "-m", "poller.main"]
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: plays
      # Compose reads ./.env automatically for substitution, so these come
      # from the same file the host-side authorization step uses. The :? form
      # fails the `up` with this message rather than starting a service that
      # can only crash-loop.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:?set SPOTIFY_CLIENT_ID in .env (copy .env.example)}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:?set SPOTIFY_CLIENT_SECRET in .env}
      SPOTIFY_TOKEN_PATH: /app/.spotify_token.json
      LISTENER_ID: ${LISTENER_ID:-nishad}
      POLL_INTERVAL: 10
    volumes:
      # Read-write on purpose: the poller rewrites this file every time it
      # refreshes the access token, and that has to outlive the container.
      #
      # The file must already exist. Docker creates a DIRECTORY in its place
      # if it does not, which is why `python -m poller.spotify_auth` runs on
      # the host first.
      - ./.spotify_token.json:/app/.spotify_token.json
    restart: unless-stopped

  jobmanager:
    <<: *flink
    command: jobmanager
    ports:
      # The Flink Web UI: jobs, their graphs, per-operator watermarks,
      # checkpoints, backpressure.
      - "8081:8081"
    volumes:
      # The JobManager writes each checkpoint's metadata and the TaskManager
      # writes its state, so both must see the same directory.
      - flink-checkpoints:/opt/flink/checkpoints
      # For ad-hoc queries with the SQL client. Read-only: jobs come from git.
      - ./flink/sql:/opt/flink/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/overview > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  taskmanager:
    <<: *flink
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    restart: unless-stopped

  consumer:
    build: .
    # The image's CMD runs the simulator; this service runs the consumer.
    command: ["python", "-m", "consumer.main"]
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: plays
      CONSUMER_GROUP: raw-plays-writer
      POSTGRES_DSN: postgresql://spot:spot@postgres:5432/spot
    # No container_name: `docker compose up --scale consumer=2` needs to be
    # free to name the replicas, and that scale-up is one of M2's exercises.
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Local, single-user, no data worth protecting: skip the login wall.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    # Deliberately no named volume. Everything Grafana knows comes from the
    # two directories above, both in git. Persistent storage would only give
    # UI-made changes somewhere to hide.
    restart: unless-stopped

volumes:
  kafka-data:
  postgres-data:
  flink-checkpoints:
